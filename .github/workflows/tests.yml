name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A green run takes about a minute; this stops a hung test well before the 6 h default.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      # Same versions evapacs-back runs, so a green run here matches what it installs.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "Django==4.2.30" "graphene==3.4.3" "graphene-django==3.2.3" \
            "django-graphql-jwt==0.4.0" "django-filter==25.1" \
            "pytest==8.3.5" "pytest-django==4.8.0"
          pip install --no-deps -e .

      - name: Run tests with tests.settings
        run: pytest --ds=tests.settings -m "not settings_b"

      - name: Run tests with tests.settings_b
        run: pytest --ds=tests.settings_b -m "settings_b"
